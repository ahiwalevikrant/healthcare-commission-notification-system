server:
  port: 8082

spring:
  application:
    name: commission-service
  datasource:
    url: jdbc:mysql://localhost:3306/commissiondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
          spring.json.add.type.headers: false

jwt:
  secret: healthcare-commission-system-secret-key-2024
  expiration: 86400000

kafka:
  topic:
    commission-calculated: commission.calculated